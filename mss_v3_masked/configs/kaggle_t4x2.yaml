seed: 1337
data:
  root: /kaggle/input/musdb18-hq/MUSDB18-HQ
  sample_rate: 44100
  sources:
  - vocals
  - drums
  - bass
  - other
  segment_seconds: 3.0
  train_samples_per_epoch: 1000
  valid_samples_per_epoch: 40
  source_remix_prob: 0.4
  num_workers: 2
  pin_memory: true
  augment:
    enabled: true
    gain_db: 6.0
    channel_swap_prob: 0.5
    polarity_flip_prob: 0.1
    source_dropout_prob: 0.0
    speed_perturb_prob: 0.1
    speed_min: 0.96
    speed_max: 1.04
model:
  sample_rate: 44100
  sources:
  - vocals
  - drums
  - bass
  - other
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  base_channels: 56
  channel_mults:
  - 1
  - 2
  - 4
  - 6
  bottleneck_layers: 2
  attention_heads: 4
  mask_temperature: 1.0
  gradient_checkpointing: true
loss:
  time_l1: 0.25
  spectral_logmag: 1.5
  spectral_convergence: 0.25
  complex_l1: 0.02
  fft_sizes:
  - 512
  - 1024
  - 2048
  - 4096
  hop_ratio: 0.25
  ratio_mask: 2.0
train:
  epochs: 120
  batch_size: 1
  grad_accum_steps: 6
  lr: 0.0002
  weight_decay: 1.0e-05
  max_grad_norm: 5.0
  amp: true
  ema_decay: 0.999
  early_stopping_patience: 18
  validate_every: 1
  save_every: 1
  log_every: 5
